# IRCOMP-GUI - Python package, Ruff and Pyright settings
# Author: Lukas (Viridis) Dubsik

[build-system]
requires = ["hatchling==1.33.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "ircomp-gui"
version = "0.1.0"
description = "Local request preparation and computational evidence review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
    "jsonschema==4.26.0",
]

[project.scripts]
ircomp-gui = "ircomp_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ircomp_gui"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/catalogue.json" = "ircomp_gui/resources/catalogue.json"
"contracts/exchange.schema.json" = "ircomp_gui/resources/exchange.schema.json"
"contracts/examples/request-valid.json" = "ircomp_gui/resources/examples/request-valid.json"
"contracts/examples/evidence-valid.json" = "ircomp_gui/resources/examples/evidence-valid.json"
"contracts/examples/evidence-empty.json" = "ircomp_gui/resources/examples/evidence-empty.json"
"contracts/examples/evidence-context-mismatch.json" = "ircomp_gui/resources/examples/evidence-context-mismatch.json"

[tool.ruff]
src = ["src"]
target-version = "py312"
indent-width = 4
line-length = 88
force-exclude = true
unsafe-fixes = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "S", "PTH", "D", "RUF"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["ircomp_gui"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImportCycles = "error"
